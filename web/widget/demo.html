<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>opendesk widget demo</title>
    <style>
      body { margin: 0; min-height: 100vh; background: #f4f4f5; }
      @media (prefers-color-scheme: dark) { body { background: #18181b; } }
    </style>
  </head>
  <body>
    <!--
      A blank host page for the opendesk chat widget, against an in-memory backend that simulates
      the AI agent (live streaming, tools, an action card, ratings and a handoff).

      Appearance, ?key=: wk_brand (brand colour), wk_left (left, offsets), wk_label (label launcher),
      wk_round (round corners), wk_square, wk_dark / wk_light (forced theme), wk_email (email capture),
      wk_human (no AI agent), wk_topics (topics), wk_files / wk_nofiles (images and PDFs only, no files),
      wk_closed / wk_offline (closed, default or own offline message and chat intro), wk_press (another
      brand). ?od_closed closes any of them, ?od_lang=ar for a language, ?od_open=1 to open it,
      ?od_welcome=0 to open new chats without the greeting and intro, ?od_fixed_lang=tr for a
      workspace that fixes its language, ?od_history for a returning visitor with open and finished
      conversations, some months old.

      The agent: tap a suggestion, or ask about an order with a number and street ("Send order #4821
      to 22 Baker Street") for a tool step and an action card, SSO for an answer with sources, or a
      person for a handoff. Hover a reply to rate it. Helpers: ?od_demo=thread, send, order, handoff.
    -->
    <script>
      window.opendesk = window.opendesk || function () { (window.opendesk.q = window.opendesk.q || []).push(arguments); };
      var params = new URLSearchParams(location.search);
      if (params.has("od_open")) opendesk("open");
      opendesk("on", "message", function (m) { console.log("[opendesk] message", m); });
      var s = document.createElement("script");
      s.type = "module";
      s.src = "/widget/src/main.tsx";
      s.dataset.key = params.get("key") || "wk_demo";
      s.dataset.mock = "1";
      if (params.get("od_lang")) s.dataset.lang = params.get("od_lang");
      document.body.appendChild(s);
      // Screenshot helpers: ?od_demo=thread opens the past conversation, ?od_demo=send sends a message,
      // ?od_demo=order asks the agent to change an order (tool step and action card),
      // ?od_demo=handoff sends one and then asks for a person.
      var order = "Can you send order #4821 to my new address? It's 22 Baker Street, London.";
      var texts = {
        en: "Hi! Our team can't log in with SSO since this morning. Is something down?",
        ja: "こんにちは。今朝からチーム全員がSSOでログインできません。障害でしょうか？",
        ar: "مرحبًا! لا يستطيع فريقنا تسجيل الدخول عبر SSO منذ الصباح. هل هناك عطل؟"
      };
      var demo = params.get("od_demo");
      if (demo) {
        var tries = 0;
        var t = setInterval(function () {
          var host = document.querySelector("[data-opendesk-widget]");
          var root = host && host.shadowRoot;
          if (!root || ++tries > 50) return;
          if (demo === "thread") {
            var c = root.querySelector(".conv");
            if (c) { c.click(); clearInterval(t); }
          } else if (demo === "send" || demo === "handoff" || demo === "order") {
            var p = root.querySelector(".primary");
            if (!p) return;
            p.click();
            clearInterval(t);
            setTimeout(function () {
              var ta = root.querySelector("textarea");
              ta.value = demo === "order" ? order : texts[params.get("od_lang")] || texts.en;
              ta.dispatchEvent(new Event("input", { bubbles: true }));
              setTimeout(function () { root.querySelector(".send").click(); }, 100);
              if (demo === "handoff") {
                var w = setInterval(function () {
                  var b = root.querySelector(".handoff");
                  if (b) { b.click(); clearInterval(w); }
                }, 100);
              }
            }, 300);
          }
        }, 100);
      }
    </script>
  </body>
</html>
