name: Desktop

# Desktop checks, desktop-only release tags, and manual packaging.
# Full releases call the same build and publish workflows from release.yml.
on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
    paths:
      - "desktop/**"
      - "brand/**"
      - ".github/workflows/desktop*.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "brand/**"
      - ".github/workflows/desktop*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  # Never cancel a release half way through uploading.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    uses: ./.github/workflows/desktop-publish.yml
    permissions:
      contents: write
      actions: write
    secrets: inherit
    with:
      tag: ${{ github.ref_name }}
      version: ${{ needs.build.outputs.version }}
      prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
