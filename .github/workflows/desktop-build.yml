name: Build desktop

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to build, or empty for the triggering ref"
        type: string
    outputs:
      version:
        value: ${{ jobs.validate.outputs.version }}
      prerelease:
        value: ${{ jobs.validate.outputs.prerelease }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12.10.1"

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundles are in dist/
        run: test -s dist/main.cjs && test -s dist/preload.cjs && test -s dist/picker-preload.cjs && test -s dist/picker/index.html
      # Electron is a devDependency but ships inside the app: audit everything.
      - name: pnpm audit
        run: pnpm audit --audit-level high

  validate:
    name: Validate tag and systems
    # On a tag, or a manual run (no version).
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      matrix: ${{ steps.systems.outputs.matrix }}
    steps:
      - id: systems
        env:
          EXCLUDE: ${{ vars.DESKTOP_RELEASE_EXCLUDE }}
        run: |
          all='[{"os":"mac","name":"macOS","runner":"macos-latest","flag":"--mac"},
                {"os":"windows","name":"Windows","runner":"windows-latest","flag":"--win"},
                {"os":"linux","name":"Linux","runner":"ubuntu-latest","flag":"--linux"}]'
          skip=$(printf '%s' "$EXCLUDE" | tr ',[:upper:]' ' [:lower:]' | xargs)
          for s in $skip; do
            case "$s" in mac|windows|linux) ;; *) echo "::error::DESKTOP_RELEASE_EXCLUDE: unknown system '$s' (mac, windows or linux)"; exit 1 ;; esac
          done
          matrix=$(jq -c --arg skip "$skip" '($skip | split(" ")) as $s | {include: [.[] | select(.os as $o | $s | index($o) | not)]}' <<< "$all")
          [ "$(jq '.include | length' <<< "$matrix")" -gt 0 ] || { echo "::error::DESKTOP_RELEASE_EXCLUDE leaves out every system"; exit 1; }
          [ -n "$skip" ] && echo "::notice::Left out of this build: $skip (DESKTOP_RELEASE_EXCLUDE)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - id: v
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          v="${TAG#desktop-}"
          v="${v#v}"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$TAG is not v<semver> or desktop-v<semver>"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.name }})
    # On a tag or a manual run, for the systems validate kept.
    needs: [check, validate]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Version from the tag
        if: needs.validate.outputs.version != ''
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: npm pkg set version="$VERSION"
      - run: pnpm build
      - name: Package
        env:
          FLAG: ${{ matrix.flag }}
          TAGGED: ${{ needs.validate.outputs.version != '' }}
          # macOS
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER }}
        run: |
          # A release is always signed (and notarized on macOS): no secrets, no release.
          if [ "$TAGGED" = true ]; then
            case "$RUNNER_OS" in
              macOS)
                if [ -z "$CSC_LINK" ] || { { [ -z "$APPLE_API_KEY_BASE64" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; } &&
                  { [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; }; }; then
                  echo "::error::A desktop release needs the macOS signing (CSC_LINK) and notarization secrets"; exit 1
                fi ;;
              Windows)
                if [ -z "$WIN_CSC_LINK" ] && { [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_CLIENT_SECRET" ] ||
                  [ -z "$AZURE_TRUSTED_SIGNING_ENDPOINT" ] || [ -z "$AZURE_TRUSTED_SIGNING_ACCOUNT" ] || [ -z "$AZURE_TRUSTED_SIGNING_PROFILE" ] || [ -z "$AZURE_TRUSTED_SIGNING_PUBLISHER" ]; }; then
                  echo "::error::A desktop release needs the Windows signing secrets (Azure Trusted Signing or WIN_CSC_LINK)"; exit 1
                fi ;;
            esac
          fi
          # No certificate: an unsigned build rather than a search of the keychain.
          if [ -z "$CSC_LINK" ] && [ -z "$WIN_CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          [ -z "$CSC_LINK" ] && unset CSC_LINK CSC_KEY_PASSWORD
          [ -z "$WIN_CSC_LINK" ] && unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          # Notarization with an App Store Connect API key: electron-builder reads
          # the .p8 from a path, written for this step only.
          if [ "$RUNNER_OS" = macOS ] && [ -n "$APPLE_API_KEY_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            trap 'rm -f "$key"' EXIT
            (umask 077 && printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key")
            export APPLE_API_KEY="$key"
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          else
            unset APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          unset APPLE_API_KEY_BASE64
          pnpm exec electron-builder --config electron-builder.config.cjs "$FLAG" --publish never
      - name: Check the macOS signature and notarization
        if: needs.validate.outputs.version != '' && runner.os == 'macOS'
        run: |
          found=0
          while IFS= read -r app; do
            found=1
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done < <(find release -maxdepth 2 -name '*.app' -type d)
          [ "$found" = 1 ] || { echo "::error::no .app in release/"; exit 1; }
      - name: Check the Windows signature
        if: needs.validate.outputs.version != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $exes = Get-ChildItem release -Filter *.exe
          if ($exes.Count -eq 0) { Write-Error "no .exe in release/"; exit 1 }
          foreach ($exe in $exes) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            if ($sig.Status -ne 'Valid') { Write-Error "$($exe.Name): signature $($sig.Status)"; exit 1 }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.blockmap
            desktop/release/latest*.yml
            desktop/release/beta*.yml
          if-no-files-found: error
          retention-days: 14

